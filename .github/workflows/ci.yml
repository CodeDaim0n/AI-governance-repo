name: Validation
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls-and-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install observed native dependency set and docs tools
        run: python -m pip install -r requirements-enterprise.lock -r requirements-docs.txt
      - name: Check Python source
        run: python -m compileall -q fabric scripts
      - name: Fetch exact historical research OPA binary
        run: python scripts/fetch_opa.py
      - name: Reproduce core controls and policy assertions
        run: OPA_BIN="$PWD/.local/opa" python scripts/test_all.py
      - name: Exercise AGT integration assertions
        run: OPA_BIN="$PWD/.local/opa" python scripts/test_agt.py
      - name: Check native adapter contracts
        run: python -m unittest discover -s tests/enterprise -v
      - name: Exercise real PostgreSQL concurrency, approval and recovery
        run: |
          PG_BIN=$(pg_config --bindir)
          python scripts/run_native_postgres.py --pg-bin "$PG_BIN" --opa "$PWD/.local/opa"
      - name: Build searchable documentation
        run: mkdocs build --strict
      - name: Preserve synthetic verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-validation-evidence
          path: results/
          retention-days: 7
# This job does not deploy services or treat contract tests as native acceptance.
