<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">Autonomous agent cycle with independent authority</title><desc id="desc">The Qwen agent chooses authorized read and commit tools, receives real observations and continues within turn, call and time budgets. A separate reviewer authorizes eligible exact actions. Source systems, release assurance and operations surround the execution loop. This reference diagram does not assert all eighteen services were observed in one run.</desc><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172d46"/></marker><marker id="context" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7656a6"/></marker><marker id="observe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker><marker id="review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b76c20"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#ffffff"/><rect x="0" y="0" width="1200" height="135" rx="16" fill="#172d46" stroke="none"/><text x="48" y="47" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#8dd8d6">AUTONOMOUS EXECUTION · INDEPENDENT AUTHORITY</text><text x="48" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Choose tools. Observe results. Continue safely.</text><rect x="48" y="180" width="344" height="168" rx="10" fill="#172d46" stroke="#172d46"/><rect x="48" y="180" width="6" height="168" rx="3" fill="#087f8c" stroke="none"/><text x="66" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Task + delegated scope</text><text x="66" y="256" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Server-owned task and identity</text><text x="66" y="281" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Explicit operation and parameters</text><text x="66" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">No self-granted authority</text><text x="66" y="335" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><rect x="428" y="180" width="344" height="168" rx="10" fill="#ffffff" stroke="#d3dfe8"/><rect x="428" y="180" width="6" height="168" rx="3" fill="#087f8c" stroke="none"/><rect x="444" y="198" width="34" height="29" rx="6" fill="#087f8c" stroke="none"/><text x="448" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">18</text><g data-component-id="18"><title>18 Qwen agent + Ollama</title></g><text x="490" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172d46">Qwen agent + Ollama</text><text x="446" y="256" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Choose the next allowed tool</text><text x="446" y="281" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Interpret real tool observations</text><text x="446" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Stop within explicit budgets</text><rect x="808" y="180" width="344" height="168" rx="10" fill="#ffffff" stroke="#d3dfe8"/><rect x="808" y="180" width="6" height="168" rx="3" fill="#b76c20" stroke="none"/><rect x="824" y="198" width="34" height="29" rx="6" fill="#b76c20" stroke="none"/><text x="828" y="219" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">05</text><g data-component-id="05"><title>05 Temporal + reviewer</title></g><text x="870" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172d46">Temporal + reviewer</text><text x="826" y="256" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Persist eligible approval waits</text><text x="826" y="281" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Separate reviewer grants authority</text><text x="826" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Resume with an approval reference</text><path d="M392 260 L428 260" fill="none" stroke="#172d46" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M600 348 L600 420" fill="none" stroke="#172d46" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M808 260 L785 260 L785 444" fill="none" stroke="#b76c20" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#review)" marker-start="url(#review)"/><rect x="428" y="420" width="344" height="190" rx="10" fill="#172d46" stroke="#172d46"/><rect x="428" y="420" width="6" height="190" rx="3" fill="#087f8c" stroke="none"/><text x="446" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Governed tool gateway</text><text x="446" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Identity • scope • current policy</text><text x="446" y="521" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Exact intent and approval binding</text><text x="446" y="546" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Default deny on missing authority</text><text x="446" y="597" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><rect x="48" y="420" width="344" height="190" rx="10" fill="#ffffff" stroke="#d3dfe8"/><rect x="48" y="420" width="6" height="190" rx="3" fill="#7656a6" stroke="none"/><text x="66" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172d46">Trusted authority</text><text x="66" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Keycloak • OpenFGA • OPA • AGT</text><text x="66" y="521" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Bao-scoped service credentials</text><text x="66" y="546" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Data, model and service context</text><rect x="808" y="420" width="344" height="190" rx="10" fill="#172d46" stroke="#172d46"/><rect x="808" y="420" width="6" height="190" rx="3" fill="#087f8c" stroke="none"/><text x="826" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Typed target adapter</text><text x="826" y="496" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Commit only permitted operations</text><text x="826" y="521" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Idempotent effect and receipt</text><text x="826" y="546" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Ledger, audit and durable outbox</text><text x="826" y="597" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><path d="M392 510 L428 510" fill="none" stroke="#7656a6" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#context)"/><path d="M772 510 L808 510" fill="none" stroke="#172d46" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M980 610 L980 655 L600 655 L600 710" fill="none" stroke="#087f8c" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#observe)"/><rect x="428" y="710" width="344" height="170" rx="10" fill="#172d46" stroke="#172d46"/><rect x="428" y="710" width="6" height="170" rx="3" fill="#087f8c" stroke="none"/><text x="446" y="750" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Actual tool observation</text><text x="446" y="786" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Read result, receipt or denial</text><text x="446" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Return to the model for next step</text><text x="446" y="836" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Never infer success from narrative</text><text x="446" y="867" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><path d="M428 795 L412 795 L412 375 L600 375 L600 348" fill="none" stroke="#087f8c" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#observe)"/><rect x="48" y="710" width="344" height="170" rx="10" fill="#ffffff" stroke="#d3dfe8"/><rect x="48" y="710" width="6" height="170" rx="3" fill="#7656a6" stroke="none"/><text x="66" y="750" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172d46">Lifecycle assurance</text><text x="66" y="786" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Risk register • model evaluation</text><text x="66" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Metadata • release security</text><text x="66" y="836" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Isolation and approved deployment</text><rect x="808" y="710" width="344" height="170" rx="10" fill="#ffffff" stroke="#d3dfe8"/><rect x="808" y="710" width="6" height="170" rx="3" fill="#b76c20" stroke="none"/><text x="826" y="750" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#172d46">Operational evidence</text><text x="826" y="786" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Traces • metrics • alerts</text><text x="826" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Incidents • tickets • risk evidence</text><text x="826" y="836" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#51657a">Reconciliation and owner review</text><path d="M980 610 L1178 610 L1178 795 L1152 795" fill="none" stroke="#087f8c" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#observe)"/><rect x="48" y="925" width="1104" height="72" rx="10" fill="#eef7f7" stroke="none"/><text x="68" y="953" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#087f8c">Autonomy operates inside delegated authority. Human approval is a deliberate pause.</text><text x="68" y="981" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#51657a">Reference architecture. Check the recorded run for observed products and target effects.</text></svg>