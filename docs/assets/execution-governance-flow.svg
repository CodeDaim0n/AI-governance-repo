<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">From proposal to an authorized effect</title><desc id="desc">Six stages show how the implementation authenticates a proposal, obtains trusted context, evaluates business policy, checks required approval, commits the target and records operational evidence.</desc><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172d46"/></marker><marker id="context" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7656a6"/></marker><marker id="observe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker><marker id="review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b76c20"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#ffffff"/><rect x="0" y="0" width="1200" height="124" rx="16" fill="#172d46" stroke="none"/><text x="48" y="48" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#8dd8d6">EXECUTION &amp; GOVERNANCE LIFECYCLE</text><text x="48" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#ffffff">From proposal to an authorized effect</text><rect x="48" y="182" width="344" height="192" rx="10" fill="#172d46" stroke="#172d46"/><rect x="48" y="182" width="6" height="192" rx="3" fill="#087f8c" stroke="none"/><text x="66" y="222" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">1  Authenticate &amp; intercept</text><text x="66" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Keycloak (#01) verifies identity.</text><text x="66" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Microsoft AGT (#02) checks tools.</text><text x="66" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">The agent cannot nominate its role.</text><text x="66" y="361" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><rect x="428" y="182" width="344" height="192" rx="10" fill="#172d46" stroke="#172d46"/><rect x="428" y="182" width="6" height="192" rx="3" fill="#087f8c" stroke="none"/><text x="446" y="222" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">2  Resolve trusted context</text><text x="446" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">OpenFGA (#04): record scope.</text><text x="446" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Metadata / release / inventory:</text><text x="446" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">OpenMetadata, MLflow, GLPI.</text><text x="446" y="361" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><rect x="808" y="182" width="344" height="192" rx="10" fill="#172d46" stroke="#172d46"/><rect x="808" y="182" width="6" height="192" rx="3" fill="#087f8c" stroke="none"/><text x="826" y="222" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">3  Evaluate business policy</text><text x="826" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">OPA (#03) applies current limits.</text><text x="826" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Unknown or invalid authority denies.</text><text x="826" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">A model proposal is not permission.</text><text x="826" y="361" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><rect x="808" y="464" width="344" height="192" rx="10" fill="#172d46" stroke="#172d46"/><rect x="808" y="464" width="6" height="192" rx="3" fill="#087f8c" stroke="none"/><text x="826" y="504" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">4  Check required approval</text><text x="826" y="540" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Temporal (#05) waits durably.</text><text x="826" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Gateway binds the exact action,</text><text x="826" y="590" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">versions, reviewer and expiry.</text><text x="826" y="643" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><rect x="428" y="464" width="344" height="192" rx="10" fill="#172d46" stroke="#172d46"/><rect x="428" y="464" width="6" height="192" rx="3" fill="#087f8c" stroke="none"/><text x="446" y="504" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">5  Commit at the boundary</text><text x="446" y="540" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">Exclusive adapter commits once.</text><text x="446" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">PostgreSQL (#14) stores the action,</text><text x="446" y="590" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">approval use, audit and outbox.</text><text x="446" y="643" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><rect x="48" y="464" width="344" height="192" rx="10" fill="#172d46" stroke="#172d46"/><rect x="48" y="464" width="6" height="192" rx="3" fill="#087f8c" stroke="none"/><text x="66" y="504" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">6  Observe &amp; respond</text><text x="66" y="540" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">OTel (#10) and monitoring (#11).</text><text x="66" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">IRIS (#12), CISO (#06) and GLPI</text><text x="66" y="590" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#d8e4ef">receive linked operational evidence.</text><text x="66" y="643" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" fill="#8bcbd1">PROJECT IMPLEMENTATION</text><path d="M392 278 L428 278" fill="none" stroke="#172d46" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M772 278 L808 278" fill="none" stroke="#172d46" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M980 374 L980 464" fill="none" stroke="#172d46" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M808 560 L772 560" fill="none" stroke="#172d46" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M428 560 L392 560" fill="none" stroke="#172d46" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="48" y="706" width="1104" height="74" rx="10" fill="#eef7f7" stroke="none"/><text x="68" y="734" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#087f8c">Approval never overrides a hard denial. Retries reuse a scoped idempotency key.</text><text x="68" y="762" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#51657a">Model generation, isolation, secret custody, evaluation and release assurance support this path.</text></svg>