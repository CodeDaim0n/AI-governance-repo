receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  attributes/minimize:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: authorization, action: delete}
  batch: {}
exporters:
  file:
    path: /evidence/traces.json
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/minimize, batch]
      exporters: [file]
